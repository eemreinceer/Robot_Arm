; Robot Arm kol -- ESP32 servo controller
;
; protocol.c / protocol.h, stm32_servo_ctrl'den SYMLINK'tir. Kopya degil:
; protokol platformdan bagimsiz saf C ve native testleri orada kosuyor. Iki
; kopya tutulursa kacinilmaz olarak ayrisirlar.
;
; UART2 kullaniliyor (UART0 DEGIL): UART0 ayni zamanda ESP32'nin boot log
; konsolu ve her reset'te oraya banner basiyor. Host tarafi (
; stm32_system_interface.cpp) yaniti tam olarak "OK" diye karsilastirdigi icin
; araya kacacak tek bir boot satiri handshake'i bozar.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
extra_scripts = pre:tools/platformio_check_calibration.py
build_flags =
    -I include
    -Wall
    -Wextra
monitor_speed = 115200

[env:native]
platform = native
test_framework = unity
test_build_src = true
extra_scripts = pre:tools/platformio_check_calibration.py
build_src_filter =
    +<motion_controller.cpp>
    +<smooth_protocol.cpp>
    +<rail_monitor.cpp>
build_flags =
    -std=gnu++17
    -I include
    -Wall
    -Wextra
    -Werror
