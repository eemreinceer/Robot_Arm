[platformio]
default_envs = bluepill_f103c8

[env:bluepill_f103c8]
platform = ststm32
; Cip kimligi donanimda dogrulandi (2026-07-14): stm32flash + ROM bootloader
;   Device ID 0x0410 (medium-density), F_SIZE registeri (0x1FFFF7E0) = 128 KB.
; Onceki "f103c6 / 32KB" varsayimi yanlisti; gercek parca C8 sinifi.
board = bluepill_f103c8
; Arduino core sart: SysTick_Handler'i o sagliyor. Onceki stm32cube kurulumunda
; SysTick_Handler hic tanimli degildi -> Default_Handler -> Infinite_Loop, ve cip
; her boot'ta ~1ms sonra doniyordu (2026-07-14 teshisi).
framework = arduino
; Yukleme ROM bootloader ile: BOOT0=1 + RESET, ardindan USART1 (PA9/PA10).
; F103'un ROM bootloader'i USB DFU DESTEKLEMEZ - flash icin UART sart.
upload_protocol = serial
; USB CDC devre disi: bu GD32F103 klonunda her iki bulk endpoint de sonsuz NAK
; veriyor (usbmon ile dogrulandi). Enumerate + EP0 calisiyor ama veri gecmiyor.
; Ayrinti icin src/main.cpp basindaki nota bak.
build_flags =
  -Wall
  -Wextra

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_flags =
  -std=c11
  -Wall
  -Wextra
  -Werror
build_src_filter =
  +<protocol.c>
