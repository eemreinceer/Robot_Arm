# Mapping fixture for test_calibration_mapping. Deliberately NOT a plausible
# robot: the wire order is reversed against the joint order (joint_1 sits on
# channel 6), two joints are inverted, and the zero offsets are non-zero and
# asymmetric. mock_calibration.yaml is the identity case -- channel n == joint n,
# no inversion, no offset -- so it cannot catch a mapping that silently drops
# back to joint order, nor a sign that cancels itself out.
channels:
  - {channel: 6, joint: joint_1, min_rad: -1.57, max_rad: 1.57, min_us: 500, max_us: 2500, zero_offset_rad: 0.0, invert: false, max_velocity_rad_s: 0.10}
  - {channel: 5, joint: joint_2, min_rad: -1.57, max_rad: 1.57, min_us: 500, max_us: 2500, zero_offset_rad: 0.25, invert: true, max_velocity_rad_s: 0.10}
  - {channel: 4, joint: joint_3, min_rad: -1.57, max_rad: 1.57, min_us: 600, max_us: 2400, zero_offset_rad: -0.30, invert: false, max_velocity_rad_s: 0.10}
  - {channel: 3, joint: joint_4, min_rad: -1.57, max_rad: 1.57, min_us: 500, max_us: 2500, zero_offset_rad: 0.0, invert: true, max_velocity_rad_s: 0.10}
  - {channel: 2, joint: joint_5, min_rad: -1.57, max_rad: 0.86, min_us: 500, max_us: 2500, zero_offset_rad: 0.10, invert: false, max_velocity_rad_s: 0.10}
  - {channel: 1, joint: joint_6, min_rad: -0.25, max_rad: 0.35, min_us: 700, max_us: 2300, zero_offset_rad: 0.05, invert: false, max_velocity_rad_s: 0.10}

soft_start:
  max_delta_us_per_step: 10
  step_period_ms: 20

activation_safety:
  calibration_complete: false
  commissioning_range_rad: 0.3
