# Physical q=0 witness frame, 2026-08-04
#
# Taken from the MJPEG bridge while the arm sat at physical q=0: the servos were
# holding commanded q=0, the arm was supported, the rail was cut, and the arm did
# not move (operator's direct observation). No motion was commanded to take this.
#
# The pink shapes in the top corners are the robot's own GRIPPERS. Camera and
# gripper are both on the wrist, so their relative image position is fixed for a
# fixed gripper command -- which makes the centroids below a standing witness for
# camera-mount shift, the one 60 mm candidate that has only ever been checked by
# hand. If they move at the same gripper command, the bracket moved.
