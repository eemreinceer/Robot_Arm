name: Repository baseline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repository-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify public commit identity
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            revision_range="$HEAD_SHA"
          else
            revision_range="$BEFORE_SHA..$HEAD_SHA"
          fi
          ./scripts/verify_commit_identity.sh "$revision_range"
      - name: Install static tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Verify repository baseline
        run: ./scripts/verify_workspace.sh --ci

  ros-jazzy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ubuntu:noble
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up ROS 2 Jazzy
        uses: ros-tooling/setup-ros@649ef6bcd696da05bc27ceb3fab69d810c0daeab # 0.7.19
        with:
          required-ros-distributions: jazzy
      - name: Install workspace dependencies
        shell: bash
        run: |
          rosdep update
          rosdep install --from-paths src --ignore-src --rosdistro jazzy -r -y \
            --skip-keys "arm_description arm_gazebo arm_kinematics arm_ml arm_moveit_config"
      - name: Clean build and test active ROS 2 packages
        shell: bash
        run: ./scripts/verify_workspace.sh --ros

  firmware-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned PlatformIO Core
        run: |
          python3 -m venv .venv-ci
          .venv-ci/bin/pip install --disable-pip-version-check platformio==6.1.19
      - name: STM32 protocol native tests
        run: .venv-ci/bin/pio test -d firmware/stm32_servo_ctrl -e native
      - name: ESP32 motion and protocol native tests
        run: .venv-ci/bin/pio test -d firmware/esp32_servo_ctrl -e native

  web-console:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/arm_perception/web/robot-arm-console
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/arm_perception/web/robot-arm-console/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build operator console
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high
